<head>

<body>
<canvas id="c" role="img" aria-label="Storia giocabile: un astronauta di carta parte dalla Terra, guida il razzo col dito e visita Mercurio, Giove e Saturno."></canvas>
<script>
(function(){
'use strict';
// ====================== REAL DATA ======================
// R = mean radius (km), d = mean distance from the Sun (AU).
var P=[
 {n:'MERCURIO',R:2440, d:0.39, c:'#B8A590'},
 {n:'VENERE',  R:6052, d:0.72, c:'#F2B45A'},
 {n:'TERRA',   R:6371, d:1.00, c:'#4F8FF0'},
 {n:'MARTE',   R:3390, d:1.52, c:'#E0553C'},
 {n:'GIOVE',   R:69911,d:5.20, c:'#D9A57A'},
 {n:'SATURNO', R:58232,d:9.58, c:'#E9CF8B'},
 {n:'URANO',   R:25362,d:19.2, c:'#8FE0DC'},
 {n:'NETTUNO', R:24622,d:30.05,c:'#3F62D8'},
 {n:'SOLE',    R:696000,d:0.1, c:'#FFC43D'}  // index 8: a star, not a planet; never drawn with drawPlanet
];
var MOONS={ // radii in km
 4:[{n:'Io',R:1822,c:'#F2D45A'},{n:'Europa',R:1561,c:'#F2EBDD'},{n:'Ganimede',R:2634,c:'#B9A48E'},{n:'Callisto',R:2410,c:'#7D7468'}],
 5:[{n:'Titano',R:2575,c:'#E9A24A'},{n:'Rea',R:764,c:'#E6E2D6'},{n:'Giapeto',R:735,c:'#C9BFAE'},{n:'Dione',R:561,c:'#E6E2D6'},{n:'Teti',R:531,c:'#F2EBDD'},{n:'Encelado',R:252,c:'#FFFFFF'}]
};
// ====================== LICENCES (all here) ======================
var JUP_PX=270, SIZE_EXP=0.85;   // flight: planet sizes, true ratios slightly squeezed
var DIST_EXP=0.5;                // distances compressed with a square root
var LEG_BASE=4, LEG_PER=2.5;     // seconds of a leg with turbo = base + per * compressed gap; cruising takes twice as long
var SUN_PX_AT_1AU=60;            // apparent Sun radius at Earth; elsewhere this / distance (true)
var MOON_PX=0.006;               // px per km for moons in the sky (true ratios among moons)
var AS=1.8;                      // astronaut scale on planets: big on purpose, not to scale

var rp=P.map(function(p){return JUP_PX*Math.pow(p.R/69911,SIZE_EXP);});
var pos=P.map(function(p){return Math.pow(p.d,DIST_EXP);});
rp[8]=140;
function legTime(a,b){return LEG_BASE+LEG_PER*Math.abs(pos[b]-pos[a]);}

var STORY=[
 {t:'rock',pl:2},
 {t:'map',a:2,b:0,say:['mappa']},{t:'fly',a:2,b:0,by:[1]},{t:'rock',pl:0},
 {t:'map',a:0,b:8,say:['sole_tuta']},{t:'fly',a:0,b:8},{t:'sun'},
 {t:'map',a:8,b:4,say:['ritorno'],wave:true},{t:'fly',a:8,b:4,by:[0,1,2,3]},{t:'jup'},
 {t:'map',a:4,b:5},{t:'fly',a:4,b:5},{t:'sat'},
 {t:'map',a:5,b:2,say:['lontani','casa'],far:true,dur:11},{t:'end'}
];

// ====================== NARRATOR ======================
// Each line has an id. If the file audio/<id>.mp3 exists it is played; the caption is for the adult.
var LINES={
 "intro": "Ciao Leonardo! Vieni con me a esplorare i pianeti?",
 "terra": "Questa è la Terra, la nostra casa. È l'unico pianeta dove sappiamo che c'è vita.",
 "terra_luna": "Quella è la Luna: gira sempre intorno alla Terra.",
 "terra_invito": "Tocca il razzo e partiamo!",
 "volo": "Muovi il dito per guidare. Prendi le stelle!",
 "turbo": "Vuoi andare più forte? Tieni premuto il fuoco!",
 "piano": "Piano, piano! Stiamo arrivando.",
 "capriola": "[ride] Ops, troppo veloci! Facciamo il giro.",
 "mercurio": "Questo è Mercurio, il pianeta più vicino al Sole.",
 "mercurio_curiosita": "È il più piccolo di tutti, e corre intorno al Sole più veloce di tutti.",
 "mercurio_invito": "Cammina verso il Sole e guarda il termometro. Poi prova dall'altra parte!",
 "mercurio_caldo": "Uff, che caldo! Qui il Sole scotta.",
 "mercurio_freddo": "Brrr, che freddo! Qui è notte e si gela.",
 "viaggio_lungo": "Giove è lontano lontano. Che viaggio lungo!",
 "giove": "Questo è Giove, il gigante. Dentro ci starebbero più di mille Terre!",
 "giove_curiosita": "È fatto di nuvole: non c'è un pavimento. E ha tantissime lune: guarda le quattro più grandi!",
 "giove_invito": "Scendi tra le nuvole e lasciati portare dal vento.",
 "giove_vento": "Senti che vento! Ci porta via!",
 "giove_macchia": "Questa macchia rossa è una tempesta più grande della Terra. Entraci!",
 "saturno": "Questo è Saturno, con i suoi anelli.",
 "saturno_curiosita": "È così leggero che in un mare grandissimo galleggerebbe. E ha più di cento lune!",
 "saturno_invito": "Vola in mezzo agli anelli e ascolta.",
 "saturno_anelli": "Gli anelli sono fatti di tanti pezzetti di ghiaccio.",
 "fine": "Eccoci a casa, Leonardo! Che viaggio: il Sole e tanti pianeti. Ripartiamo?",
 "bravo": "Bravo Leonardo!",
 "mappa": "Guarda, questo è il nostro viaggio! Il Sole sta al centro, e tutti i pianeti gli girano intorno.",
 "ciao_venere": "Ciao Venere! Sei tutta coperta di nuvole.",
 "sole_tuta": "Adesso andiamo dal Sole. Mettiamo la tuta d'oro e apriamo il parasole!",
 "sole": "Questo è il Sole. Non è un pianeta: è una stella, una palla di fuoco grandissima.",
 "sole_curiosita": "È così grande che dentro ci starebbero un milione di Terre!",
 "sole_invito": "Qui non si può atterrare. Tocca il bordo e guarda cosa succede!",
 "sole_fiamma": "Wow, una fiammata! Che caldo!",
 "sole_luce": "Il Sole dà luce e calore a tutti i pianeti.",
 "ritorno": "Adesso torniamo indietro, verso i pianeti lontani.",
 "ciao_mercurio": "Ciao Mercurio!",
 "ciao_venere2": "Ciao Venere!",
 "ciao_terra": "Ciao Terra, casa nostra!",
 "ciao_marte": "Ciao Marte! Sei il pianeta rosso.",
 "lontani": "Laggiù ci sono Urano e Nettuno, lontanissimi e freddissimi. Ci andremo la prossima volta!",
 "casa": "Adesso torniamo a casa, sulla Terra."
};
var cap={text:'',t:0},voice=null,said={},queue=[],cur=null;
// Lines wait their turn; a reaction to what the child just did (front) goes next.
function say(id,once,front){
  if(once&&said[id])return;said[id]=true;if((cur&&cur.id===id)||queue.indexOf(id)>=0)return;
  if(front){queue.unshift(id);cur=null;}else queue.push(id);if(queue.length>4)queue.length=4;
}
function narr(dt){
  if(cur){cur.t-=dt;if(cur.t<=0)cur=null;}
  if(!cur&&queue.length){var id=queue.shift(),tx=LINES[id]||'',c={id:id,t:1.4+tx.length*0.075};cur=c;
    cap.text=tx.replace(/\[[^\]]*\]\s*/g,'');cap.t=c.t;
    try{if(voice)voice.pause();var a=new Audio('audio/'+id+'.mp3');voice=a;
      a.addEventListener('loadedmetadata',function(){if(cur===c&&isFinite(a.duration)){c.t=a.duration+0.15;cap.t=c.t;}});
      var pr=a.play();if(pr&&pr.catch)pr.catch(function(){});}catch(e){}}
}

// ====================== CANVAS ======================
var cv=document.getElementById('c'),ctx=cv.getContext('2d');
var H=390,W=844,s=1,vw=0,vh=0,rot=false,dpr=1;
function resize(){
  vw=window.innerWidth;vh=window.innerHeight;dpr=Math.min(window.devicePixelRatio||1,2);
  rot=vh>vw;s=(rot?vw:vh)/H;W=(rot?vh:vw)/s;
  cv.width=Math.round(vw*dpr);cv.height=Math.round(vh*dpr);
}
window.addEventListener('resize',resize);resize();
function toGame(e){var sx=e.clientX,sy=e.clientY;return rot?{x:sy/s,y:(vw-sx)/s}:{x:sx/s,y:sy/s};}
function shadow(on){
  if(!on){ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetX=0;ctx.shadowOffsetY=0;return;}
  ctx.shadowColor='rgba(6,8,30,0.5)';ctx.shadowBlur=6*s*dpr;
  if(rot){ctx.shadowOffsetX=-3*s*dpr;ctx.shadowOffsetY=0;}else{ctx.shadowOffsetX=0;ctx.shadowOffsetY=3*s*dpr;}
}
var FONT='"Baloo 2", "Arial Rounded MT Bold", system-ui, sans-serif';

// ====================== HELPERS ======================
var seed=7;function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,t){return a+(b-a)*t;}
function smooth(t){t=clamp(t,0,1);return t*t*(3-2*t);}
function angd(a,b){return Math.atan2(Math.sin(a-b),Math.cos(a-b));}
function hex(c){return [parseInt(c.substr(1,2),16),parseInt(c.substr(3,2),16),parseInt(c.substr(5,2),16)];}
function mix(a,b,t){var x=hex(a),y=hex(b);return 'rgb('+Math.round(lerp(x[0],y[0],t))+','+Math.round(lerp(x[1],y[1],t))+','+Math.round(lerp(x[2],y[2],t))+')';}
var SKY=['#5E2A45','#33265A','#151A40','#080B22'];
function skyColor(d){var t=clamp(Math.log(d/0.39)/Math.log(30.05/0.39),0,1)*3,i=Math.min(2,Math.floor(t));return mix(SKY[i],SKY[i+1],t-i);}
function circle(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();}
function star4(x,y,r,a){ctx.save();ctx.translate(x,y);ctx.rotate(a||0);ctx.beginPath();
  for(var k=0;k<8;k++){var rr=k%2?r*0.3:r,an=k*Math.PI/4;ctx.lineTo(Math.sin(an)*rr,-Math.cos(an)*rr);}
  ctx.closePath();ctx.fill();ctx.restore();}
function star5(x,y,r,a){ctx.save();ctx.translate(x,y);ctx.rotate(a||0);ctx.beginPath();
  for(var k=0;k<10;k++){var rr=k%2?r*0.46:r,an=k*Math.PI/5;ctx.lineTo(Math.sin(an)*rr,-Math.cos(an)*rr);}
  ctx.closePath();ctx.fill();ctx.restore();}
function ring(x,y,r,al,w){ctx.strokeStyle='rgba(255,215,114,'+al+')';ctx.lineWidth=w||4;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.stroke();}
function pulse(x,y,r){var ph=(time*0.8)%1;ring(x,y,r+ph*30,0.95*(1-ph),6);}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();}

// ====================== SOUND (optional) ======================
var ac=null;
function initAudio(){if(ac)return;try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){ac=null;}}
function beep(f,dur,type,vol,delay){if(!ac)return;try{
  var t=ac.currentTime+(delay||0),o=ac.createOscillator(),g=ac.createGain();
  o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(vol||0.07,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+dur);}catch(e){}}
function chime(){beep(523,0.25,'triangle',0.08);beep(659,0.25,'triangle',0.08,0.1);beep(784,0.4,'triangle',0.08,0.2);}
var PENTA=[523,587,659,784,880,1047,1175];
// ---------- sound profile: a quiet music box, wind and engine, all made here (no files, no licences) ----------
var snd=null;
var MEL=[76,0,79,0,81,79,76,0,74,0,76,79,72,0,0,0,79,0,81,0,84,81,79,0,76,0,74,76,72,0,0,0],BASS=[48,45,41,43,48,45,41,43];
function startSound(){
  if(snd||!ac)return;try{
    var master=ac.createGain();master.connect(ac.destination);
    var mg=ac.createGain();mg.gain.value=0.05;var dl=ac.createDelay(1);dl.delayTime.value=0.34;var fb=ac.createGain();fb.gain.value=0.28;
    mg.connect(master);mg.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(master);
    var len=ac.sampleRate*2,buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);for(var k=0;k<len;k++)d[k]=Math.random()*2-1;
    var noise=function(type,freq,q){var sr=ac.createBufferSource();sr.buffer=buf;sr.loop=true;var f=ac.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;
      var g=ac.createGain();g.gain.value=0;sr.connect(f);f.connect(g);g.connect(master);sr.start();return g;};
    snd={mg:mg,wind:noise('bandpass',520,0.7),rumble:noise('lowpass',160,0.5),next:ac.currentTime+0.3,step:0};
  }catch(e){snd=null;}
}
function mnote(m,t,dur,vol,att){var o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=440*Math.pow(2,(m-69)/12);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+att);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(snd.mg);o.start(t);o.stop(t+dur+0.05);}
function soundTick(){
  if(!snd||!S)return;try{
    var now=ac.currentTime,tr=S.t==='jup'?-3:S.t==='sat'?-5:(S.t==='rock'&&S.pl===0)?2:0;
    if(snd.next<now-1)snd.next=now;
    while(snd.next<now+0.25){var i=snd.step%32,m=MEL[i];
      if(m){mnote(m+tr,snd.next,1.8,0.5,0.02);mnote(m+tr+12,snd.next,0.9,0.12,0.02);}
      if(i%4===0)mnote(BASS[(snd.step/4|0)%8]+tr,snd.next,2.2,0.4,0.5);
      snd.next+=0.46;snd.step++;}
    var talking=voice&&!voice.paused&&!voice.ended;
    snd.mg.gain.setTargetAtTime(talking?0.02:0.05,now,0.3);
    snd.wind.gain.setTargetAtTime(S.t==='jup'?Math.min(1,Math.abs(S.wind)/175)*0.1:0,now,0.15);
    snd.rumble.gain.setTargetAtTime(S.t==='fly'?S.f*0.07:S.t==='sat'?0.02:0,now,0.2);
  }catch(e){}
}


// ====================== STATE ======================
var time=0,idle=0,si=0,S=null,trans=null,parts=[];
var ptr={down:false,x:0,y:0,id:null};
var FW=1400,farStars=[],midStars=[],blobs=[],scroll=0,i;
for(i=0;i<70;i++)farStars.push({x:rnd()*FW,y:rnd()*H,r:0.8+rnd()*1.2,ph:rnd()*6});
for(i=0;i<26;i++)midStars.push({x:rnd()*FW,y:rnd()*H,r:1.6+rnd()*1.6,ph:rnd()*6,big:rnd()<0.25});
for(i=0;i<5;i++)blobs.push({x:rnd()*FW,y:rnd()*H,r:90+rnd()*120});

function part(x,y,vx,vy,life,kind,c,r){parts.push({x:x,y:y,vx:vx,vy:vy,life:life,t:0,k:kind,c:c,r:r});}
function burst(x,y,n,col){for(var k=0;k<n;k++){var a=rnd()*Math.PI*2,v=80+rnd()*200;part(x,y,Math.cos(a)*v,Math.sin(a)*v,0.7+rnd()*0.5,'star',col||'#FFC43D',4+rnd()*6);}}

function enter(idx){
  si=idx;var sc=STORY[si];idle=0;parts.length=0;queue.length=0;
  if(sc.t==='rock'){
    S={t:'rock',pl:sc.pl,th:sc.pl===2?0.32:0.22,target:null,dir:1,moving:false,walk:0,born:time,emit:0,hot:sc.pl!==0,cold:sc.pl!==0};
    if(sc.pl===2){say('intro');say('terra');say('terra_luna');say('terra_invito');}else{say('mercurio');say('mercurio_curiosita');say('mercurio_invito');}
  }else if(sc.t==='jup'){
    S={t:'jup',ax:W*0.45,ay:120,wind:0,spin:0,born:time,emit:0,carried:false,tok:[false,false]};say('giove');say('giove_curiosita');say('giove_invito');
  }else if(sc.t==='sat'){
    S={t:'sat',x:W*0.3,y:H*0.72,tx:W*0.3,ty:H*0.72,ang:0,got:0,born:time,chunks:[],done:false};
    for(var k=0;k<70;k++){var ln=Math.floor(rnd()*6);S.chunks.push({s:rnd(),lane:ln,r:6+rnd()*8,hop:0,hit:false,a:rnd()*6,sp:0.02+0.004*(5-ln)});}
    say('saturno');say('saturno_curiosita');say('saturno_invito');
  }else if(sc.t==='map'){
    S={t:'map',a:sc.a,b:sc.b,born:time,dur:sc.dur||6.5,wave:!!sc.wave,far:!!sc.far};(sc.say||[]).forEach(function(q){say(q);});
  }else if(sc.t==='sun'){
    S={t:'sun',ax:W*0.5,tx:W*0.5,flares:[],n:0,born:time,emit:0};say('sole');say('sole_curiosita');say('sole_invito');
  }else if(sc.t==='fly'){
    S={t:'fly',by:sc.by||[],byS:{},a:sc.a,b:sc.b,p:0,f:0,steerId:null,turboId:null,ty:H*0.5,ry:H*0.5,vy:0,landing:false,landT:0,over:0,loops:0,rev:false,
       T:legTime(sc.a,sc.b),items:[],spawnT:0.4,got:0,warnT:0,born:time};
    say('volo',true);say('turbo',true);
  }else{S={t:'end',born:time};chime();say('fine');}
}
function go(next,cx,cy){if(trans)return;trans={t:0,next:next,cx:cx,cy:cy,switched:false};beep(180,0.5,'sawtooth',0.04);beep(360,0.4,'sine',0.05,0.1);}

// ---------- geometry ----------
function rockG(){return S.pl===2?{x:W*0.5,y:H*0.86,r:170,lim:0.75,rk:-0.36}:{x:W*0.45,y:H*0.68,r:92,lim:1.72,rk:0};}
function rockRocket(){var g=rockG();return {x:g.x+Math.sin(g.rk)*(g.r+56),y:g.y-Math.cos(g.rk)*(g.r+56)};}
function rockReady(){return S.hot&&S.cold;}
function turboBtn(){return {x:W-100,y:H-96,r:50};}
var JR=1400;function jupC(){return {x:W*0.5,y:205+JR};}
function jupDepth(x,y){var c=jupC(),dx=x-c.x,dy=y-c.y;return JR-Math.sqrt(dx*dx+dy*dy);}
function jupPt(phi,depth){var c=jupC(),r=JR-depth;return {x:c.x+Math.sin(phi)*r,y:c.y-Math.cos(phi)*r};}
function jupRocket(){return {x:86,y:92};}
function jupTok(k){return k===0?jupPt(0.235,30):jupPt(-0.2,92);}
var SUNR=1300;function sunC(){return {x:W*0.5,y:190+SUNR};}
function mapX(k){if(k===8)return 70;var a=Math.pow(P[0].d,0.35),b=Math.pow(P[7].d,0.35);return 150+(W-210)*(Math.pow(P[k].d,0.35)-a)/(b-a);}
function mapR(k){return 1.1*Math.pow(rp[k],0.55);}
var BY={0:'ciao_mercurio',1:'ciao_venere2',2:'ciao_terra',3:'ciao_marte'};
function byC(k,n){return n===1?0.3:0.1+k*0.15;}
var SATY=[150,172,194,238,260,282]; // ring lanes; the gap in the middle is the Cassini division
function chunkX(ch){var v=(ch.s+time*ch.sp)%1;return (1-v)*(W+120)-60;}
function satGate(){return {x:W-80,y:H*0.72};}

// ====================== INPUT ======================
cv.addEventListener('pointerdown',function(e){
  e.preventDefault();initAudio();if(ac&&ac.state==='suspended'){try{ac.resume();}catch(_){}}startSound();
  var g=toGame(e),rk,dx,dy;if(trans)return;
  if(S.t==='fly'){
    var b=turboBtn();dx=g.x-b.x;dy=g.y-b.y;
    if(dx*dx+dy*dy<70*70){S.turboId=e.pointerId;}else{S.steerId=e.pointerId;S.ty=g.y;}
    idle=0;return;
  }
  ptr.down=true;ptr.x=g.x;ptr.y=g.y;ptr.id=e.pointerId;
  if(S.t==='rock'){
    rk=rockRocket();dx=g.x-rk.x;dy=g.y-rk.y;
    if(dx*dx+dy*dy<70*70){if(rockReady())go(si+1,rk.x,rk.y);else idle=4;ptr.down=false;return;}
    idle=0;
  }else if(S.t==='jup'){
    rk=jupRocket();dx=g.x-rk.x;dy=g.y-rk.y;
    if(dx*dx+dy*dy<70*70){if(S.tok[0]&&S.tok[1])go(si+1,rk.x,rk.y);else idle=4;ptr.down=false;return;}
    idle=0;
  }else if(S.t==='sat'){S.tx=g.x;S.ty=g.y;idle=0;}
  else if(S.t==='map'){if(time-S.born>1.2)S.born=time-S.dur;}
  else if(S.t==='sun'){
    rk=jupRocket();dx=g.x-rk.x;dy=g.y-rk.y;
    if(dx*dx+dy*dy<70*70){if(S.n>=3)go(si+1,rk.x,rk.y);else idle=4;ptr.down=false;return;}
    idle=0;S.tx=g.x;var c=sunC(),ddx=g.x-c.x,ddy=g.y-c.y;

function update(dt){
  time+=dt;idle+=dt;cap.t-=dt;narr(dt);soundTick();var k,it;
  if(trans){trans.t+=dt/0.55;
    if(trans.t>=1&&!trans.switched){trans.switched=true;ptr.down=false;enter(trans.next);}
    if(trans.t>=2)trans=null;}
  if(S.t==='rock')updRock(dt);else if(S.t==='jup')updJup(dt);else if(S.t==='sat')updSat(dt);else if(S.t==='fly')updFly(dt);else if(S.t==='map')updMap(dt);else if(S.t==='sun')updSun(dt);
  else scroll+=dt*0.2;
  for(k=parts.length-1;k>=0;k--){it=parts[k];it.t+=dt;it.x+=it.vx*dt;it.y+=it.vy*dt;
    if(it.k==='star'){it.vx*=0.96;it.vy*=0.96;}if(it.t>it.life)parts.splice(k,1);}
}
function updMap(dt){scroll+=dt*0.05;if(time-S.born>S.dur&&!trans)go(si+1,mapX(S.b),H*0.5);}

  S.emit-=dt;if(S.emit<=0){part(S.ax+(rnd()-0.5)*50,70,(rnd()-0.5)*60,70+rnd()*50,0.8,'drop','#7CC6F2',9);S.emit=0.16;}
}
function rockHeat(){return S.pl===0?clamp(-Math.sin(S.th)*1.04,-1,1):0;}
function updRock(dt){
  scroll+=dt*0.05;var g=rockG();S.moving=false;

    if(dy>0&&Math.abs(dx)<g.r)S.target=dx<0?-g.lim:g.lim;}
  if(S.target!==null){var d=S.target-S.th;
    if(Math.abs(d)>0.02){var st=clamp(d,-1.25*dt,1.25*dt);S.th+=st;S.dir=st>0?1:-1;S.moving=true;S.walk+=dt*10;}else S.target=null;}
  var h=rockHeat(),hx=g.x+Math.sin(S.th)*(g.r+54*AS),hy=g.y-Math.cos(S.th)*(g.r+54*AS);

    if(!S.cold&&h<-0.94){S.cold=true;burst(W-64,300,18,'#BFE3F5');chime();if(S.hot)say('bravo');}
  }

  if(S.emit<=0){
    if(h>0.35){part(hx+(rnd()-0.5)*50,hy+10,(rnd()-0.5)*60,70+rnd()*50,0.8,'drop','#7CC6F2',7+h*4);S.emit=0.26-h*0.14;}
    else if(h<-0.35){part(hx+(rnd()-0.5)*70,hy-20,(rnd()-0.5)*20,22+rnd()*16,1.3,'snow','#F7F3EA',7);S.emit=0.22;}
    else S.emit=0.2;}
}
function updJup(dt){
  scroll+=dt*0.05;var cx=S.ax,cy=S.ay,dep=jupDepth(cx,cy),w=dep<0?0:dep<62?175:-175;
  S.wind=lerp(S.wind,w,Math.min(1,dt*4));

    if(S.spin<=0){S.tok[1]=true;burst(sp.x,sp.y,18);chime();if(S.tok[0])say('bravo');}return;}
  if(touching){var dx=ptr.x-S.ax,dy=(ptr.y-40)-S.ay,dd=Math.sqrt(dx*dx+dy*dy);
    if(dd>5){var v=Math.min(230,dd*5);S.ax+=dx/dd*v*dt;S.ay+=dy/dd*v*dt;}}
  S.ax+=S.wind*(touching?0.6:1)*dt;
  var atEdge=S.ax<=56||S.ax>=W-56;S.ax=clamp(S.ax,56,W-56);
  if(!touching&&atEdge&&dep>0)S.ay-=70*dt; // the wind lets go at the edge: float back up

  if(Math.abs(S.wind)>90)say('giove_vento',true,true);
  var t0=jupTok(0),t1=jupTok(1);
  if(!S.tok[0]&&Math.pow(S.ax-t0.x,2)+Math.pow(S.ay-t0.y,2)<46*46){S.tok[0]=true;burst(t0.x,t0.y,18);chime();}
  if(!S.tok[1]&&Math.pow((S.ax-t1.x)/70,2)+Math.pow((S.ay-t1.y)/34,2)<1){S.spin=1;say('giove_macchia',true,true);beep(220,1.5,'sine',0.04);}
  S.emit-=dt;if(S.emit<=0){S.emit=0.07;
    if(Math.abs(S.wind)>60)part(S.ax-Math.sign(S.wind)*(60+rnd()*40),S.ay-50+rnd()*90,S.wind*2.4,0,0.35,'line','rgba(255,255,255,0.8)',26);}
}
function updSat(dt){
  scroll+=dt*0.05;var dx=S.tx-S.x,dy=(S.ty-34)-S.y,dd=Math.sqrt(dx*dx+dy*dy);
  if(dd>4){var v=Math.min(300,dd*5);S.x+=dx/dd*v*dt;S.y+=dy/dd*v*dt;S.ang=lerp(S.ang,Math.atan2(dy,dx),Math.min(1,dt*6));}

function flyTurbo(){return S.turboId!==null&&!S.landing&&S.over===0&&!S.rev;}
function updFly(dt){
  var turbo=flyTurbo(),k,it;
  if(S.over>0){S.over+=dt/1.7;S.f=lerp(S.f,1,Math.min(1,dt*3));if(S.over>=1){S.over=0;S.p=0.62;S.loops++;S.rev=true;}}

  if(idle>4&&!trans){if(S.n<3)ghost(W*0.62,sunC().y-Math.sqrt(SUNR*SUNR-Math.pow(W*0.12,2))+10);else ghost(rk.x,rk.y);}
}
function drawEnd(){
  var t=time-S.born,g={x:W*0.5,y:H*0.86,r:170};drawSky(1,W*0.12,H*0.3);

function draw(){

  if(trans){var t=trans.t,open=t<1?1-smooth(t):smooth(t-1),R=open*Math.sqrt(W*W+H*H);
    var cx=t<1?trans.cx:W*0.5,cy=t<1?trans.cy:H*0.5;

}
if(!ctx.roundRect){CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();};}
